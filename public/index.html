<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Devices</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header__info">
          <h1>Network Devices</h1>
          <p id="summary">Loading...</p>
        </div>

        <div class="header__actions">
          <label class="view-toggle">
            <input
              class="view-toggle__input"
              type="checkbox"
              id="detail-toggle"
              checked
            />
            <span class="view-toggle__label">Detailed</span>
          </label>

          <button class="header__refresh" id="refresh" type="button">
            ↻ Refresh
          </button>
        </div>
      </header>

      <section id="devices" class="devices">
        <p class="loading">Loading devices...</p>
      </section>

      <div class="chart">
        <canvas id="online-chart"></canvas>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/app.js"></script>
    <script>
      const ctx = document.getElementById("online-chart");

      const DAY = 24 * 60 * 60 * 1000;
      const ticks = [];

      const chart = new Chart(ctx, {
        type: "line",

        data: {
          datasets: [
            {
              label: "Online devices",
              data: [],
              borderColor: "black",
              borderWidth: 2,
              pointRadius: 4,
              tension: 0.2,
            },
          ],
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,

          scales: {
            x: {
              type: "linear",

              afterBuildTicks: (scale) => {
                scale.ticks = ticks.map((value) => ({
                  value,
                }));
              },

              ticks: {
                callback: (value) => {
                  return new Date(value).toLocaleDateString("en-CA", {
                    timeZone: "Asia/Manila",
                  });
                },
              },

              title: {
                display: true,
                text: "Date",
              },
            },

            y: {
              beginAtZero: true,

              ticks: {
                precision: 0,
              },

              title: {
                display: true,
                text: "Count",
              },
            },
          },
        },
      });

      async function loadOnlineCounts() {
        const response = await fetch("/api/online-counts");
        const rows = await response.json();

        if (rows.length === 0) {
          return;
        }

        // Convert database rows into { x, y } points.
        const points = rows.map((row) => ({
          x: new Date(row.recorded_at).getTime(),
          y: row.online_count,
        }));

        /*
         * Get the date of the first and last records
         * in Manila time.
         */
        const firstDate = new Date(rows[0].recorded_at).toLocaleDateString(
          "en-CA",
          {
            timeZone: "Asia/Manila",
          },
        );

        const lastDate = new Date(
          rows[rows.length - 1].recorded_at,
        ).toLocaleDateString("en-CA", {
          timeZone: "Asia/Manila",
        });

        /*
         * Same behavior as your example:
         *
         * firstDate + 1 day
         * -----------------
         * first tick starts at midnight of the
         * day AFTER the first record.
         */
        const first = new Date(`${firstDate}T00:00:00+08:00`);

        first.setDate(first.getDate() + 1);

        const start = first.getTime();

        const end = new Date(`${lastDate}T00:00:00+08:00`).getTime();

        /*
         * Generate one midnight tick per day.
         */
        ticks.length = 0;

        for (let t = start; t <= end; t += DAY) {
          ticks.push(t);
        }

        chart.data.datasets[0].data = points;

        chart.update();
      }

      loadOnlineCounts();
    </script>
  </body>
</html>
