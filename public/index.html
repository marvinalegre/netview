<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Network Devices</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header__info">
          <h1>Network Devices</h1>
          <p id="summary">Loading...</p>
        </div>

        <div class="header__actions">
          <label class="view-toggle">
            <input
              class="view-toggle__input"
              type="checkbox"
              id="detail-toggle"
              checked
            />
            <span class="view-toggle__label">Detailed</span>
          </label>

          <button class="header__refresh" id="refresh" type="button">
            ↻ Refresh
          </button>
        </div>
      </header>

      <section id="devices" class="devices">
        <p class="loading">Loading devices...</p>
      </section>

      <div class="chart">
        <canvas id="online-chart"></canvas>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/app.js"></script>
    <script>
      const ctx = document.getElementById("online-chart");

      const chart = new Chart(ctx, {
        type: "line",

        data: {
          labels: [],
          datasets: [
            {
              label: "Online devices",
              data: [],
              borderColor: "black",
              borderWidth: 2,
              tension: 0.3,
              pointRadius: 2,
            },
          ],
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,

          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                precision: 0,
              },
            },
          },
        },
      });

      async function loadOnlineCounts() {
        const response = await fetch("/api/online-counts");
        const rows = await response.json();

        chart.data.labels = rows.map((row) =>
          new Date(row.recorded_at).toLocaleTimeString(),
        );

        chart.data.datasets[0].data = rows.map((row) => row.online_count);

        chart.update();
      }

      loadOnlineCounts();
    </script>
  </body>
</html>
